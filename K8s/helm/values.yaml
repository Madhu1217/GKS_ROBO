# Registry and repository for Docker images
# Default is docker/robotshop/image:latest
image:
  # repo: 493644444921.dkr.ecr.us-east-1.amazonaws.com/robot-shop
  repo: asia-south1-docker.pkg.dev/robot-shop-gke-madhu/robot-shop
  # version: latest
  tag: latest
  pullPolicy: Always
  pullSecret: gcp-registry-secret

# EUM configuration
# Provide your key and set the endpoint
eum:
  key: null
  url: https://eum-eu-west-1.instana.io
  #url: https://eum-us-west-2.instana.io

# Pod Security Policy
psp:
  enabled: false

# For the mini ones minikube, minishift set to true
nodeport: false

# "special" Openshift. Set to true when deploying to any openshift flavour
openshift: false

ocCreateRoute: false

######################################
# Affinities for individual workloads
# set in the following way:
# <workload>:
#   affinity: {}
#   nodeSelector: {}
#   tolerations: []
######################################
service:
  type: ClusterIP    # All backend services
  port: 8080

# Web frontend service — also ClusterIP, Ingress handles external access
web:
  service:
    type: ClusterIP
    port: 8080

cart: {}

catalogue: {}

dispatch: {}

mongodb: {}

mysql: {}

payment:
  # Alternative payment gateway URL
  # Default is https://www.paypal.com
  gateway: null
  #gateway: https://www.worldpay.com

rabbitmq: {}

ratings: {}

redis:
  # Storage class to use with redis statefulset.
  storageClassName: standard

shipping: {}

user: {}

web: {}

persistence:
  mongodb:
    storageClass: standard    # Generic standard storage class for on-prem
    size: 5Gi
  mysql:
    storageClass: standard    # Generic standard storage class for on-prem
    size: 5Gi

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx    # Changed from gce to nginx for on-prem
    kubernetes.io/ingress.allow-http: "true"
  hosts:
    - host: madhurobo.duckdns.org
      paths:
        - path: /
          pathType: Prefix


resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
